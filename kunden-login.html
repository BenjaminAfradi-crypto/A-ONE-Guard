<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <meta name="robots" content="noindex,nofollow">
  <title>Kundenportal Login · A ONE Guard</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <a class="brand" href="./index.html"><img class="brand-mark" src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span>Kundenportal</span></div></a>
      <div class="kicker">KUNDENZUGANG</div>
      <h1>Kundenportal</h1>
      <p>Dienstplan, Leistungsstunden, freigegebene Wachbuch- und Rundgangsnachweise, Vorfälle, Rechnungen und Reklamationen.</p>
      <form id="customer-login-form">
        <div class="field"><label>E-Mail</label><input class="input" id="email" type="email" autocomplete="email" required></div>
        <div class="field"><label>Passwort</label><input class="input" id="password" type="password" autocomplete="current-password" required></div>
        <button class="btn primary block" type="submit">Kundenportal öffnen</button>
      </form>
      <div id="login-error" class="error" style="margin-top:12px"></div>
      <div class="divider"></div>
      <a class="btn block" href="./login.html">Zum Mitarbeiter-Login</a>
    </section>
  </main>
  <script src="./core.js"></script>
  <script src="./kunden-login.js"></script>
  <script src="./register-sw.js"></script>
</body>
</html>
