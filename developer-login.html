<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b10"><title>Developer Access · A ONE Guard</title><link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg"><link rel="stylesheet" href="./styles.css"><style>body{background:#070b10}.dev-login{min-height:100vh;display:grid;place-items:center;padding:24px}.dev-card{width:min(460px,100%);background:#0d131b;border:1px solid #273343;border-radius:22px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.dev-badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#152031;border:1px solid #2a4668;color:#9dc8ff;font-size:12px;font-weight:800}.dev-card h1{margin:14px 0 8px}.dev-card p{color:#98a7b8}.brandline{display:flex;align-items:center;gap:10px}.brandline img{width:42px;height:42px}.errorbox{color:#ff9ca3;font-size:13px;min-height:20px;margin-top:10px}</style></head><body><main class="dev-login"><section class="dev-card"><div class="brandline"><img src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><div class="muted">Platform Developer Access</div></div></div><div class="dev-badge" style="margin-top:18px">INTERNAL · DEVELOPER ONLY</div><h1>Developer Login</h1><p>Separater technischer Zugang für Entwicklung, Diagnose und Modulprüfung.</p><form id="dev-login-form"><div class="field"><label>E-Mail</label><input class="input" name="email" type="email" autocomplete="username" required></div><div class="field"><label>Passwort</label><input class="input" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary block" type="submit">Developer Console öffnen</button><div id="dev-login-error" class="errorbox"></div></form><div class="divider"></div><a class="btn block" href="./admin-login.html">Zum normalen Management-Login</a></section></main><script src="./core.js"></script><script src="./developer-auth.js"></script></body></html>
