<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1016"><meta name="robots" content="noindex,nofollow"><title>Fuhrpark · A ONE Guard</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/aone-mark.svg"><link rel="stylesheet" href="./styles.css"><style>.page{max-width:1480px;margin:auto;padding:0 18px 48px}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:16px 0}.hero h1{font-size:clamp(32px,5vw,50px);margin:4px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.metric b{display:block;font-size:29px}.metric span{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.vehicle{border:1px solid var(--line);border-radius:15px;padding:13px;margin:8px 0;background:#0e151e;cursor:pointer}.vehicle.active{border-color:#4778ae}.event{border-bottom:1px solid var(--line);padding:11px 0}.event:last-child{border:0}.event .top{display:flex;justify-content:space-between;gap:10px}.event .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:5px}.due{color:#ffd26c}.overdue{color:#ff9aa2}.modal-back{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:100}.modal-back.open{display:flex}.modal-sheet{width:min(820px,100%);max-height:92vh;overflow:auto;background:#101720;border:1px solid #35445a;border-radius:24px 24px 0 0;padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}@media(max-width:900px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width: iv><div class="kicker">FUHRPARKVORGANG</div><h2 style="margin:4px 0">Vorgang erfassen</h2></div><button class="btn small" id="close-modal">Schließen</button></div><form id="event-form"><div class="form-grid"><div class="field"><label>Fahrzeug</label><select class="select" id="f-vehicle" required></select></div><div class="field"><label>Art</label><select class="select" id="f-type"><option value="fuel">Tankvorgang</option><option value="damage">Schaden</option><option value="accident">Unfall</option><option value="maintenance">Wartung</option><option value="tuev">TÜV</option><option value="uvv">UVV</option><option value="repair">Reparatur</option><option value="license_check">Führerscheinkontrolle</option></select></div><div class="field"><label>Zeitpunkt</label><input class="input" type="datetime-local" id="f-occurred"></div><div class="field"><label>Nächste Fälligkeit</label><input class="input" type="date" id="f-due"></div><div class="field"><label>Kilometerstand</label><input class="input" type="number" step="0.1" min="0" id="f-odo"></div><div class="field"><label>Kosten (€)</label><input class="input" type="number" step="0.01" min="0" id="f-amount"></div><div class="field"><label>Liter</label><input class="input" type="number" step="0.01" min="0" id="f-liters"></div><div class="field"><label>Werkstatt / Anbieter</label><input class="input" id="f-vendor"></div><div class="field"><label>Status</label><select class="select" id="f-status"><option value="completed">Erledigt</option><option value="reported">Gemeldet</option><option value="open">Offen</option><option value="scheduled">Geplant</option><option value="canceled">Storniert</option></select></div><div class="field"><label>Objekt</label><select class="select" id="f-site"></select></div><div class="field"><label>Mitarbeiter</label><select class="select" id="f-employee"></select></div><div class="field wide"><label>Beschreibung</label><textarea class="textarea" id="f-description"></textarea></div></div><button
