<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>A ONE Guard · Developer Passwort</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#070b10;color:#eef4fb;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(460px,100%);background:#0d131b;border:1px solid #273343;border-radius:22px;padding:26px;box-shadow:0 24px 70px #0007}.badge{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid #2a4668;background:#152031;color:#9dc8ff;font-size:12px;font-weight:800;letter-spacing:.04em}h1{font-size:26px;line-height:1.2;margin:14px 0 8px}p{color:#aab7c6}label{display:block;margin:18px 0 8px;font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid #354254;background:#090e14;color:white;font-size:17px}button,a{width:100%;display:block;margin-top:16px;border:0;border-radius:12px;padding:14px;text-align:center;text-decoration:none;font-weight:800;font-size:16px}button{background:#eaf3ff;color:#07111d}a{background:#131d29;color:#cfe3ff;border:1px solid #2a3a4d}.muted{font-size:13px;color:#8594a5}.ok{display:none;margin-top:16px;padding:12px;border-radius:12px;background:#102419;color:#b9f4ce;border:1px solid #275b3a}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">INTERNAL · DEVELOPER</span>
    <h1>Developer-Passwort festlegen</h1>
    <p>Lege dein Passwort für den A ONE Guard Developer-Zugang fest.</p>

    <form id="pwForm" method="post" target="resultFrame" action="https://rwojydgekobbckpcvlnu.supabase.co/functions/v1/developer-password-setup">
      <input type="hidden" name="token" value="6zCOn2QHrAVXmKAT6DvkCO18A-vqM5swCoOrV9-e65E">
      <label for="password">Neues Passwort</label>
      <input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required>
      <p class="muted">Mindestens 12 Zeichen, Groß-/Kleinbuchstabe, Zahl und Sonderzeichen.</p>
      <button type="submit">Passwort setzen</button>
    </form>

    <div id="ok" class="ok">Anfrage gesendet. Warte kurz und öffne anschließend den Developer-Login.</div>
    <a href="https://a-one-guard.vercel.app/developer-login.html">Developer-Login öffnen</a>
    <iframe name="resultFrame" hidden></iframe>
  </main>
  <script>
    document.getElementById('pwForm').addEventListener('submit',()=>{
      setTimeout(()=>document.getElementById('ok').style.display='block',700);
    });
  </script>
</body>
</html>
