<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <meta name="robots" content="noindex,nofollow">
  <title>Security Operations · A ONE Guard</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .ops-tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 16px;scrollbar-width:none}.ops-tabs::-webkit-scrollbar{display:none}.ops-tab{white-space:nowrap;border:1px solid var(--line);background:#101823;color:#9eafc1;padding:10px 14px;border-radius:12px;font-weight:800}.ops-tab.active{background:#1b3658;color:#fff;border-color:#315e91}.ops-hero{background:linear-gradient(135deg,#14243a,#101720 55%,#151b22);border:1px solid #2b4058;border-radius:24px;padding:22px;margin-bottom:16px}.ops-hero h1{margin:6px 0;font-size:clamp(28px,4vw,42px);letter-spacing:-1.2px}.ops-hero p{margin:0;color:#aebccd}.metric{min-height:118px}.metric .stat{font-size:34px}.metric small{display:block;color:var(--muted);margin-top:5px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{min-height:80px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.ops-list{display:grid;gap:10px}.ops-item{border:1px solid var(--line);background:#0f171f;border-radius:14px;padding:13px}.ops-item.critical{border-color:#6e2c36;background:#211217}.ops-item.high{border-color:#6f5420}.route-layout{display:grid;grid-template-columns:minmax(240px,.7fr) minmax(0,1.3fr);gap:14px}.route-card{cursor:pointer}.route-card.active{border-color:#3d8bfd;background:#13243a}.progressline{height:8px;background:#263241;border-radius:99px;overflow:hidden}.progressline i{display:block;height:100%;background:#4f91f7}.linkbox{word-break:break-all;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#080d12;border:1px solid #26384d;border-radius:10px;padding:9px;color:#a9c9ef}.empty-mini{padding:18px;text-align:center;color:var(--muted)}@media(max-width:780px){.form-grid,.route-layout,.quick{grid-template-columns:1fr}.ops-hero{padding:18px}.ops-tabs{position:sticky;top:68px;z-index:15;background:linear-gradient(var(--bg) 80%,transparent)}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="./admin.html"><img class="brand-mark" src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span id="org-name">Security Operations</span></div></a>
    <div class="top-actions"><span class="context-name muted" id="who"></span><a class="btn small" href="./admin.html">Command Center</a><a class="btn small" href="./einsatz.html">Mitarbeiteransicht</a><button class="btn small" id="logout">Abmelden</button></div>
  </header>
  <section class="ops-hero">
    <span class="badge">LIVE OPERATIONS</span>
    <h1>Einsatz & Sicherheit</h1>
    <p>Wachbuch, Vorfälle und Wächterkontrollsystem in einer operativen Oberfläche.</p>
  </section>
  <nav class="ops-tabs" id="ops-tabs">
    <button class="ops-tab active" data-tab="overview">Lagebild</button>
    <button class="ops-tab" data-tab="watchbook">Wachbuch</button>
    <button class="ops-tab" data-tab="incidents">Vorfälle</button>
    <button class="ops-tab" data-tab="wks">WKS / Rundgänge</button>
  </nav>
  <main id="ops-view"></main>
</div>
<script src="./core.js"></script>
<script src="./security-ops.js"></script>
<script src="./register-sw.js"></script>
</body>
</html>
