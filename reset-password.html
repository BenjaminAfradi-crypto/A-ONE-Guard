<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b10"><title>Passwort neu setzen · A ONE Guard</title><link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg"><link rel="stylesheet" href="./styles.css"><style>body{background:#070b10}.reset-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.reset-card{width:min(480px,100%);background:#0d131b;border:1px solid #273343;border-radius:22px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.brandline{display:flex;align-items:center;gap:10px}.brandline img{width:42px;height:42px}.reset-card h1{margin:18px 0 8px}.reset-card p{color:#98a7b8}.errorbox{color:#ff9ca3;font-size:13px;min-height:20px;margin-top:10px}.successbox{color:#8fe0ab;font-size:13px;min-height:20px;margin-top:10px}</style></head><body><main class="reset-wrap"><section class="reset-card"><div class="brandline"><img src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><div class="muted">Sicherer Passwort-Reset</div></div></div><h1>Neues Passwort setzen</h1><p>Vergib ein neues Passwort mit mindestens 12 Zeichen und mindestens drei Zeichengruppen.</p><form id="reset-form"><div class="field"><label>Neues Passwort</label><input class="input" name="password" type="password" autocomplete="new-password" minlength="12" required></div><div class="field"><label>Passwort wiederholen</label><input class="input" name="confirm" type="password" autocomplete="new-password" minlength="12" required></div><button class="btn primary block" type="submit">Passwort speichern</button><div id="reset-error" class="errorbox"></div><div id="reset-success" class="successbox"></div></form><div class="divider"></div><a class="btn block" href="./developer-login.html">Zum Developer Login</a></section></main><script src="./core.js"></script><script src="./reset-password.js"></script></body></html>
