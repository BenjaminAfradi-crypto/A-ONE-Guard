e);border-radius:16px;padding:14px;background:#0f171f;margin:9px 0}.route-mobile.active{border-color:#3b6fa9;background:#12243a}.checkpoint{display:flex;align-items:center;gap:10px;border:1px solid #29384a;border-radius:13px;padding:11px;margin:8px 0}.checkpoint .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#202d3b;font-weight:900}.checkpoint.done .dot{background:#175c34;color:#aef0c3}.scanbox{border:1px dashed #3b5d83;background:#0c1722;border-radius:15px;padding:13px;margin-top:12px}.notice-danger{padding:13px;border-radius:14px;background:#2b1116;border:1px solid #6c2934;color:#ffc2c7}.history-item{border-bottom:1px solid #273343;padding:11px 0}.history-item:last-child{border-bottom:0}.safe-bottom{height:env(safe-area-inset-bottom)}@media(max-width:520px){.employee-shell{padding:10px}.employee-tabs{gap:5px}.employee-tab{font-size:11px;padding:10px 4px}.quickgrid{grid-template-columns:1fr}}</style></head><body><div class="employee-shell"><header class="employee-head"><a class="employee-brand" href="./app.html"><img src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span id="org-name">Einsatz</span></div></a><div class="row wrap"><a class="btn small" href="./mein-dienstausch.html">Dienstausch</a><a class="btn small" href="./mein-fahrtenbuch.html">Fahrtenbuch</a><a class="btn small" href="./meine-dokumente.html">Dokumente</a><a class="btn small" href="./meine-ausruestung.html">Ausrüstung</a><a class="btn small" href="./app.html">Zur App</a><button class="btn small" id="logout">Abmelden</button></div></header><nav class="employee-tabs"><button class="employee-tab active" data-tab="today">Heute</button><button class="employee-tab" data-tab="watchbook">Wachbuch</button><button class="employee-tab" data-tab="wks">Rundgang</button><button class="employee-tab" data-tab="incident">Vorfall</button></nav><main id="employee-view"></main><div class="safe-bottom"></div></div><script src="./core.js"></script><script src=".
