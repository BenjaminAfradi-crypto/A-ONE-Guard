<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <meta name="robots" content="noindex,nofollow">
  <title>Kundenportal · A ONE Guard</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .portal-hero{background:linear-gradient(135deg,#10243a,#101720 60%,#111a23);border:1px solid #29486a;border-radius:24px;padding:22px;margin-bottom:14px}
    .portal-hero h1{margin:5px 0;font-size:clamp(30px,5vw,48px);letter-spacing:-1.2px}.portal-hero p{margin:0;color:#aebccd}
    .portal-tabs{display:flex;gap:7px;overflow:auto;margin:14px 0;padding:4px;border:1px solid var(--line);background:#0c1219;border-radius:14px}
    .portal-tabs button{white-space:nowrap;border:0;background:transparent;color:var(--muted);font-weight:800;padding:10px 13px;border-radius:10px}.portal-tabs button.active{background:#1b2b3e;color:#fff}
    .portal-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.portal-toolbar .input,.portal-toolbar .select{width:auto;min-width:150px}
    .portal-card-list{display:grid;gap:10px}.portal-row{border:1px solid var(--line);background:#101720;border-radius:14px;padding:14px}.portal-row h3{margin:0 0 5px}.portal-row .meta{color:var(--muted);font-size:13px;display:flex;gap:8px;flex-wrap:wrap}
    .portal-kpi{min-height:110px}.portal-kpi .stat{font-size:30px}.ticket-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}
    @media(max-width:820px){.ticket-grid{grid-template-columns:1fr}.portal-toolbar .input,.portal-toolbar .select{width:100%}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><a class="brand" href="./kundenportal.html"><img class="brand-mark" src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span>Kundenportal</span></div></a><div class="top-actions"><span class="context-name muted" id="portal-user"></span><a class="btn small" href="./change-password.html">Passwort</a><button class="btn small" id="logout">Abmelden</button></div></header>
  <section class="portal-hero"><span class="badge">CUSTOMER PORTAL</span><h1 id="company-name">Kundenportal</h1><p id="portal-subtitle">Freigegebene operative Nachweise und kaufmännische Übersicht.</p></section>
  <div class="portal-toolbar"><select class="select" id="account-switch" hidden></select><label class="muted">Von <input class="input" id="date-from" type="date"></label><label class="muted">Bis <input class="input" id="date-to" type="date"></label><button class="btn" id="refresh">Aktualisieren</button></div>
  <section class="grid cols-4" id="portal-stats" style="margin-top:14px"></section>
  <nav class="portal-tabs" id="portal-tabs"><button class="active" data-tab="overview">Übersicht</button><button data-tab="schedule">Dienstplan</button><button data-tab="hours">Stunden</button><button data-tab="watchbook">Wachbuch</button><button data-tab="patrols">Rundgänge</button><button data-tab="incidents">Vorfälle</button><button data-tab="invoices">Rechnungen</button><button data-tab="tickets">Reklamationen</button></nav>
  <main id="portal-view"></main>
</div>
<script src="./core.js"></script><script src="./kundenportal.js"></script><script src="./register-sw.js"></script>
</body>
</html>
