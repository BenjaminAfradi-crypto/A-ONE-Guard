<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1016"><title>Fuhrpark & Fahrtenbuch · A ONE Guard</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg"><link rel="stylesheet" href="./styles.css"><style>.page{max-width:1480px;margin:auto;padding:0 18px 48px}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:14px 0 18px}.hero h1{font-size:clamp(32px,5vw,50px);margin:3px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:16px;border:1px solid var(--line);background:var(--panel);border-radius:16px}.metric b{display:block;font-size:28px}.grid2{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px}.vehicle{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.trip{display:grid;grid-template-columns:1.1fr 1fr .8fr .8fr;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.trip:last-child{border:0}.small{font-size:12px;color:var(--muted)}.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;z-index:90;padding:18px;align-items:flex-end;justify-content:center}.modal-back.open{display:flex}.sheet{width:min(720px,100%);max-height:94vh;overflow:auto;background:#101720;border:1px solid #35445a;border-radius:24px 24px 0 0;padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar .input{max-width:260px}.pill.open{background:#3d2e13;color:#ffd782}.pill.closed{background:#163b27;color:#8fe0ab}@media(max-width:950px){.grid2{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.trip{grid-template-columns:1fr 1fr}}@media(max-width:620px){.page{padding:0 10px 38px}.trip,.form-grid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="./admin.html"><img class="brand-mark" src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span id="org-name">Fuhrpark</span></div></a><div class="top-actions"><span id="who" class="context-name muted"></span><a class="btn small" href="./admin.html">Command Center</a><a class="btn small" href="./dienstplan.html">Dienstplan</a><button class="btn small" id="logout">Abmelden</button></div></header></div><main class="page"><section class="hero"><div><div class="kicker">Mobility</div><h1>Fuhrpark & Fahrtenbuch</h1><p class="muted">Fahrzeuge, Abfahrt, Ankunft, Kilometerstände und Dienstfahrten zentral dokumentieren.</p></div><div class="row wrap"><button class="btn" id="refresh">Aktualisieren</button><button class="btn primary" id="new-vehicle">+ Fahrzeug</button></div></section><section class="metrics"><div class="metric"><b id="m-active">0</b><span>aktive Fahrzeuge</span></div><div class="metric"><b id="m-open">0</b><span>laufende Fahrten</span></div><div class="metric"><b id="m-trips">0</b><span>Fahrten im Zeitraum</span></div><div class="metric"><b id="m-km">0</b><span>dokumentierte km</span></div></section><div class="toolbar" style="margin-top:14px"><select class="input" id="vehicle-filter"><option value="">Alle Fahrzeuge</option></select><select class="input" id="status-filter"><option value="">Alle Fahrten</option><option value="open">Laufend</option><option value="closed">Abgeschlossen</option></select><select class="input" id="days-filter"><option value="30">30 Tage</option><option value="7">7 Tage</option><option value="90">90 Tage</option><option value="365">12 Monate</option></select></div><div class="grid2"><section class="panel"><h2>Fahrzeuge</h2><div id="vehicle-list"></div></section><section class="panel"><h2>Fahrten</h2><div id="trip-list"></div></section></div></main><div class="modal-back" id="vehicle-back"><div class="sheet"><div class="row between"><div><div class="kicker">Fuhrpark</div><h2 id="vehicle-title">Fahrzeug</h2></div><button class="btn small" id="close-vehicle">Schließen</button></div><form id="vehicle-form"><input type="hidden" id="v-id"><div class="form-grid"><div class="field"><label>Kennzeichen</label><input class="input" id="v-plate" required></div><div class="field"><label>Fahrzeugnummer</label><input class="input" id="v-no"></div><div class="field"><label>Hersteller</label><input class="input" id="v-maker"></div><div class="field"><label>Modell</label><input class="input" id="v-model"></div><div class="field"><label>Kilometerstand</label><input class="input" id="v-odo" type="number" min="0" step="0.1"></div><div class="field"><label>Status</label><select class="input" id="v-active"><option value="true">Aktiv</option><option value="false">Inaktiv</option></select></div></div><button class="btn primary" type="submit">Speichern</button></form></div></div><script src="./core.js"></script><script src="./fahrtenbuch.js"></script><script src="./register-sw.js"></script></body></html>
