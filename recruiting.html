<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1016"><meta name="robots" content="noindex,nofollow"><title>Recruiting · A ONE Guard</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/aone-mark.svg"><link rel="stylesheet" href="./styles.css"><style>.page{max-width:1480px;margin:auto;padding:0 18px 48px}.hero{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin:16px 0}.hero h1{font-size:clamp(32px,5vw,50px);margin:4px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.metric b{display:block;font-size:29px}.metric span{font-size:12px;color:var(--muted)}.pipeline{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px;overflow:auto;padding-bottom:8px}.column{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:12px;min-height:300px}.column h3{margin:0 0 10px;display:flex;justify-content:space-between}.candidate{border:1px solid #29384a;background:#0e151e;border-radius:14px;padding:12px;margin:8px 0;cursor:pointer}.candidate:hover{border-color:#4673a5}.candidate b{display:block}.candidate .meta{font-size:11px;color:var(--muted);margin-top:5px}.modal-back{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:16px;z-index:100}.modal-back.open{display:flex}.modal-sheet{width:min(850px,100%);max-height:92vh;overflow:auto;background:#101720;border:1px solid #35445a;border-radius:24px 24px 0 0;padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:620px){.page{padding:0 10px 36px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style><
