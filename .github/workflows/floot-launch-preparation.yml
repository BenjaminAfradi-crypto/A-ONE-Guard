name: Floot launch package checks
on:
  pull_request:
    paths: ["launch/**", ".github/workflows/floot-launch-preparation.yml"]
  push:
    branches: ["codex/floot-launch-preparation"]
    paths: ["launch/**", ".github/workflows/floot-launch-preparation.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: launch/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run patches
