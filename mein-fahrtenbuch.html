<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1016"><title>Mein Fahrtenbuch · A ONE Guard</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg"><link rel="stylesheet" href="./styles.css"><style>.page{max-width:780px;margin:auto;padding:14px 12px 90px}.hero{padding:18px;border:1px solid var(--line);background:linear-gradient(135deg,#10243a,#101720);border-radius:22px;margin-bottom:12px}.hero h1{margin:5px 0}.cardx{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.open-trip{border-color:#496f9d}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.trip-row{border-bottom:1px solid var(--line);padding:11px 0}.trip-row:last-child{border:0}.big{width:100%;min-height:56px;font-weight:900;font-size:16px}.small{font-size:12px;color:var(--muted)}@media(max-width:600px){.form-grid{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="row between"><a class="brand" href="./app.html"><img class="brand-mark" src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span id="org-name">Fahrtenbuch</span></div></a><button class="btn small" id="logout">Abmelden</button></div><section class="hero"><div class="kicker">Digitales Fahrtenbuch</div><h1>Meine Dienstfahrten</h1><p class="muted">Abfahrt und Ankunft mit Kilometerstand dokumentieren. Pro Mitarbeiter kann nur eine Fahrt gleichzeitig offen sein.</p></section><section id="open-box"></section><section class="cardx"><h2>Neue Fahrt</h2><form id="start-form"><div class="form-grid"><div class="field"><label>Fahrzeug</label><select class="input" id="f-vehicle" required></select></div><div class="field"><label>Objekt</label><select class="input" id="f-site"></select></div><div class="field"><label>Abfahrts-km</label><input class="input" id="f-odo" type="number" min="0" step="0.1" required></div><div class="field"><label>Abfahrtsort</label><input class="input" id="f-place" placeholder="z. B. Gießen"></div><div class="field"><label>Zweck</label><input class="input" id="f-purpose" value="Dienstfahrt"></div><div class="field"><label>Dienst</label><select class="input" id="f-shift"></select></div></div><button class="btn primary big" type="submit">Abfahrt erfassen</button></form></section><section class="cardx"><h2>Letzte Fahrten</h2><div id="history"></div></section></main><div class="modal-back" id="end-back"><div class="modal"><div class="row between"><h2>Fahrt beenden</h2><button class="btn small" id="close-end">Schließen</button></div><form id="end-form"><div class="field"><label>Ankunfts-km</label><input class="input" id="e-odo" type="number" min="0" step="0.1" required></div><div class="field"><label>Ankunftsort</label><input class="input" id="e-place"></div><div class="field"><label>Routen-/Fahrtnotiz</label><textarea class="textarea" id="e-note"></textarea></div><button class="btn primary big" type="submit">Endfahrt erfassen</button></form></div></div><script src="./core.js"></script><script src="./mein-fahrtenbuch.js"></script><script src="./register-sw.js"></script></body></html>
