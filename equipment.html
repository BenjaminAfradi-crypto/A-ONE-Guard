<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1016">
  <meta name="robots" content="noindex,nofollow">
  <title>Betriebsmittel & Schlüssel · A ONE Guard</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .asset-tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 16px}.asset-tab{white-space:nowrap;border:1px solid var(--line);background:#101823;color:#9eafc1;padding:10px 14px;border-radius:12px;font-weight:800}.asset-tab.active{background:#1b3658;color:#fff;border-color:#315e91}.asset-hero{background:linear-gradient(135deg,#12253a,#101720 60%,#171b21);border:1px solid #2c4058;border-radius:24px;padding:22px;margin-bottom:16px}.asset-hero h1{margin:6px 0;font-size:clamp(28px,4vw,42px);letter-spacing:-1px}.asset-hero p{margin:0;color:#aebccd}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:1/-1}.asset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.asset-card{border:1px solid var(--line);background:#101720;border-radius:16px;padding:15px}.asset-card.issued{border-color:#375b83}.asset-card.lost,.asset-card.damaged{border-color:#71313a;background:#211317}.asset-card.maintenance{border-color:#70551f}.asset-card h3{margin:2px 0 5px}.asset-meta{font-size:13px;color:var(--muted);display:grid;gap:4px}.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mini-stat{min-height:104px}.mini-stat .stat{font-size:30px}.history{display:grid;gap:8px}.history-item{border-bottom:1px solid var(--line);padding:10px 0}.history-item:last-child{border-bottom:0}@media(max-width:900px){.asset-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.form-grid,.asset-grid{grid-template-columns:1fr}.asset-hero{padding:18px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="./admin.html"><img class="brand-mark" src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span id="org-name">Betriebsmittel</span></div></a>
    <div class="top-actions"><span class="context-name muted" id="who"></span><a class="btn small" href="./security-ops.html">Security Ops</a><a class="btn small" href="./admin.html">Command Center</a><button class="btn small" id="logout">Abmelden</button></div>
  </header>
  <section class="asset-hero"><span class="badge">OPERATIONS · INVENTAR</span><h1>Betriebsmittel & Schlüssel</h1><p>Funkgeräte, Bodycams, Handys, Taschenlampen und Schlüssel nachvollziehbar ausgeben und zurücknehmen.</p></section>
  <nav class="asset-tabs"><button class="asset-tab active" data-tab="equipment">Betriebsmittel</button><button class="asset-tab" data-tab="keys">Schlüssel</button><button class="asset-tab" data-tab="history">Verlauf</button></nav>
  <main id="asset-view"></main>
</div>
<script src="./core.js"></script>
<script src="./equipment.js"></script>
<script src="./register-sw.js"></script>

</html>
