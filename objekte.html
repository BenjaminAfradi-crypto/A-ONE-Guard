<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1016"><title>Objekte · A ONE Guard</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg"><link rel="stylesheet" href="./styles.css">
<style>
.core-page{max-width:1480px;margin:auto;padding:0 18px 48px}.hero2{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin:14px 0 18px}.hero2 h1{font-size:clamp(32px,5vw,50px);margin:3px 0;letter-spacing:-1.5px}.hero2 p{margin:0;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:16px;border:1px solid var(--line);background:var(--panel);border-radius:16px}.metric b{display:block;font-size:29px}.metric span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar .input{max-width:330px}.site-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.site-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;cursor:pointer}.site-card:hover{border-color:#49627e}.site-card h3{margin:0 0 4px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.meta span{padding:4px 7px;border-radius:999px;background:#1a2837;color:#cbd6e1;font-size:10px}.sub{font-size:12px;color:var(--muted)}.panel-back{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;z-index:90;padding:18px;align-items:flex-end;justify-content:center}.panel-back.open{display:flex}.panel-sheet{width:min(850px,100%);max-height:94vh;overflow:auto;background:#101720;border:1px solid #35445a;border-radius:24px 24px 0 0;padding:20px}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.policy-help{padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:#aebccc;font-size:12px;margin-top:8px}.empty-card{grid-column:1/-1;text-align:center;padding:38px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
@media(max-width:980px){.site-grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:650px){.core-page{padding:0 10px 36px}.site-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<div class="shell"><header class="topbar"><a class="brand" href="./admin.html"><img class="brand-mark" src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span id="org-name">Objekte</span></div></a><div class="top-actions"><span id="who" class="context-name muted"></span><a class="btn small" href="./admin.html">Command Center</a><button class="btn small" id="logout">Abmelden</button></div></header></div>
<main class="core-page"><section class="hero2"><div><div class="kicker">Operations</div><h1>Objekte</h1><p>Standorte, Kunden und Standortprüfung zentral und schnell verwalten.</p></div><div class="row wrap"><button class="btn" id="refresh">Aktualisieren</button><button class="btn primary" id="new-site">+ Objekt</button></div></section>
<section class="metrics"><div class="metric"><b id="m-active">0</b><span>aktive Objekte</span></div><div class="metric"><b id="m-enforce">0</b><span>Geofence erzwungen</span></div><div class="metric"><b id="m-coords">0</b><span>mit Standort</span></div><div class="metric"><b id="m-inactive">0</b><span>inaktiv</span></div></section>
<div class="toolbar"><input class="input" id="search" placeholder="Objekt, Kunde oder Adresse"><select class="input" id="policy-filter"><option value="">Alle Standortregeln</option><option value="off">Standort aus</option><option value="record">Standort protokollieren</option><option value="enforce">Geofence erzwingen</option></select><select class="input" id="active-filter"><option value="">Aktiv + inaktiv</option><option value="true">Nur aktiv</option><option value="false">Nur inaktiv</option></select></div><section class="site-grid" id="site-grid"></section></main>
<div class="panel-back" id="site-back"><div class="panel-sheet"><div class="sheet-head"><div><div class="kicker">Objektakte</div><h2 id="site-title" style="margin:4px 0">Objekt</h2></div><button class="btn small" id="close-site">Schließen</button></div><form id="site-form"><input type="hidden" id="site-id"><div class="form-grid"><div class="field"><label>Objektname</label><input class="input" id="f-name" required></div><div class="field"><label>Kunde</label><input class="input" id="f-customer"></div><div class="field full"><label>Adresse</label><input class="input" id="f-address"></div><div class="field"><label>Breitengrad</label><input class="input" id="f-lat" type="number" step="any"></div><div class="field"><label>Längengrad</label><input class="input" id="f-lng" type="number" step="any"></div><div class="field"><label>Geofence Radius (m)</label><input class="input" id="f-radius" type="number" min="25" max="2000" value="150"></div><div class="field"><label>Standortregel</label><select class="input" id="f-policy"><option value="off">Aus</option><option value="record">Nur protokollieren</option><option value="enforce">Geofence erzwingen</option></select></div><div class="field"><label>Status</label><select class="input" id="f-active"><option value="true">Aktiv</option><option value="false">Inaktiv</option></select></div></div><div class="policy-help" id="policy-help"></div><div class="quick-actions"><button class="btn" type="button" id="use-location">Aktuellen Standort übernehmen</button><button class="btn primary" type="submit">Speichern</button><a class="btn" id="go-plan" href="./dienstplan.html">Dienstplan</a><a class="btn" id="go-nfc" href="./nfc-admin.html">NFC-Tag</a></div><div id="site-msg"></div></form></div></div>
<script src="./core.js"></script><script src="./objekte.js"></script><script src="./register-sw.js"></script></body></html>
