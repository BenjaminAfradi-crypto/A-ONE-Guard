<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1016"><title>Dokumentenzentrale · A ONE Guard</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./assets/aone-mark.svg"><link rel="stylesheet" href="./styles.css"><style>.doc-hero{background:linear-gradient(135deg,#12253a,#101720 60%,#171b21);border:1px solid #2c4058;border-radius:24px;padding:22px;margin-bottom:16px}.doc-hero h1{margin:6px 0;font-size:clamp(30px,5vw,46px)}.doc-tabs{display:flex;gap:8px;overflow:auto;margin:0 0 14px}.doc-tabs button{white-space:nowrap}.doc-tabs .active{background:#1b3658;border-color:#315e91}.doc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.doc-card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:15px}.doc-card h3{margin:4px 0}.doc-meta{display:grid;gap:4px;font-size:12px;color:var(--muted);margin:10px 0}.doc-actions{display:flex;gap:7px;flex-wrap:wrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar .input,.toolbar .select{max-width:260px}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.file-drop{border:1px dashed #40546c;border-radius:14px;padding:15px}.version{font-size:11px;color:#8ebfff}.expired{border-color:#6f3038}.due{border-color:#6f5a23}@media(max-width:980px){.doc-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.doc-grid,.upload-grid{grid-template-columns:1fr}.wide{grid-column:auto}.doc-hero{padding:18px}}</style></head><body><div class="shell"><header class="topbar"><a class="brand" href="./admin.html"><img class="brand-mark" src="./assets/aone-mark.svg" alt="A ONE"><div><b>A ONE Guard</b><span id="org-name">Dokumentenzentrale</span></div></a><div class="top-actions"><span id="who" class="context-name muted"></span><a class="btn small" href="./personalakte.html">Personalakte</a><a class="btn small" href="./compliance.html">Compliance</a><a class="btn small" href="./admin.html">Command Center</a><button class="btn small" id="logout">Abmelden</button></div></header><section class="doc-hero"><span class="badge">DMS · DSGVO · VERSIONEN</span><h1>Dokumentenzentrale</h1><p class="muted">Eingang, Prüfung, Ausgang und Archiv mit geschützter Ablage, Versionierung und Zugriffsprotokoll.</p></section><section class="grid cols-4" id="stats"></section><nav class="doc-tabs" id="tabs"><button class="btn small active" data-stage="all">Alle</button><button class="btn small" data-stage="inbox">Eingang</button><button class="btn small" data-stage="review">Prüfung</button><button class="btn small" data-stage="outbox">Ausgang</button><button class="btn small" data-stage="archive">Archiv</button></nav><div class="row between wrap"><div class="toolbar"><input class="input" id="search" placeholder="Nr., Titel, Kategorie"><select class="select" id="scope-filter"><option value="">Alle Zugriffe</option><option value="management">Management</option><option value="hr">HR vertraulich</option><option value="members">Alle Mitarbeitenden</option><option value="employee">Einzelner Mitarbeiter</option></select><select class="select" id="category-filter"><option value="">Alle Kategorien</option></select></div><button class="btn primary" id="new-doc">+ Dokument</button></div><main id="docs" class="doc-grid"></main></div><div class="modal-back" id="modal-back"><div class="modal" id="modal"></div></div><script src="./core.js"></script><script src="./documents.js"></script><script src="./register-sw.js"></script></body></html>
